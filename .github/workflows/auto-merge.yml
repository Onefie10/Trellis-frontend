name: Auto Merge Pull Requests (Doris Maintainer Automation)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  auto-merge:
    name: Process and Auto-Merge PRs as Doris
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DORIS_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Doris Git Identity
        run: |
          git config --global user.name "Doris Maduegbunam"
          git config --global user.email "dorismaduegbunam@gmail.com"

      - name: Run Auto-Merge Engine (Doris Identity)
        env:
          DORIS_PAT: ${{ secrets.DORIS_PAT }}
          GITHUB_TOKEN: ${{ secrets.DORIS_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/auto-merge-prs.mjs

      - name: Enable Auto-Merge & Issue Linking via GitHub CLI
        if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
        env:
          GH_TOKEN: ${{ secrets.DORIS_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve --body "Approved by @dorismaduegbunam (Doris Maintainer Automation)." || true
          gh pr merge "$PR_URL" --auto --merge || true
