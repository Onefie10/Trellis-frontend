name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Playwright smoke and journey tests
        run: npx playwright test e2e/smoke.spec.ts e2e/journey.spec.ts

      # Latency (500-3000ms), random HTTP 5xx and dropped requests against the
      # app's API routes. Faults are seeded, so a failure reproduces locally
      # with the seed shown in the test title.
      - name: Run network chaos resilience tests
        run: npm run test:e2e:chaos

      - name: Run accessibility audits (axe-core, WCAG A/AA)
        run: npm run test:e2e:a11y

      # Visual baselines are committed under e2e/__screenshots__/. On the first
      # run after this workflow lands there are none yet, so they are generated
      # and uploaded as an artifact instead of failing the build.
      - name: Check for visual baselines
        id: visual-baseline
        run: |
          if [ -d e2e/__screenshots__ ]; then
            echo "have_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_baseline=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No visual baselines committed yet — generating them and uploading as an artifact."
            npm run test:e2e:visual:update
          fi

      - name: Run visual regression tests
        if: steps.visual-baseline.outputs.have_baseline == 'true'
        run: npm run test:e2e:visual

      - name: Upload generated visual baselines
        uses: actions/upload-artifact@v4
        if: steps.visual-baseline.outputs.have_baseline == 'false'
        with:
          name: playwright-visual-baselines
          path: e2e/__screenshots__/
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - name: Upload failure traces and videos
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-failures-${{ matrix.project }}
          path: test-results/
          retention-days: 7
